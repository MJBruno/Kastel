name: Kastel CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check

      - name: Rust tests
        run: cargo test

      - name: Kastel regression tests
        run: cargo run --bin test_runner